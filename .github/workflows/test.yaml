on:
  push:
    branches:
      - master
    paths-ignore:
      - '.*'
      - '.*/**'
  workflow_dispatch:
    inputs:
      package:
        description: Which package or commit to build (default is HEAD commit)
        required: false

name: Build package
run-name: ${{ github.event.head_commit.message || format('{0} (rebuild)', inputs.package) }}

env:
  BLABLA: nogmeer

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'Deleting packages')"
    name: Prepare
    runs-on: ubuntu-latest
    outputs: 
      variables: ${{ toJSON(steps.lookup.outputs) }}
    steps:
      - id: lookup
        name: Get info from monorepo
        run: |
          echo "universe=gert" >> $GITHUB_OUTPUT
          echo "UNIVERSE_NAME=jeroen" >> $GITHUB_OUTPUT
          echo "MY_UNIVERSE=https://www.google.com" >> $GITHUB_OUTPUT
        shell: bash


  build:
    needs: [prepare]
    name: Build and deploy
    uses: jeroen/test/.github/workflows/build.yaml@main
    with:
      variables: ${{ needs.prepare.outputs.variables }}
    env: ${{ needs.prepare.outputs.variables }}
    secrets:
      DUMMY_SESSION: ${{ secrets.DUMMY_SESSION }}
      CRANLIKEPWD: ${{ secrets.CRANLIKEPWD }}
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
      SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      BOT_TOKEN: ${{ secrets.GHPAT }}
