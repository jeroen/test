on:
  push:
    branches:
      - master
    paths-ignore:
      - '.*'
      - '.*/**'
  workflow_dispatch:
    inputs:
      package:
        description: Which package or commit to build (default is HEAD commit)
        required: false

name: Build package
run-name: ${{ github.event.head_commit.message || format('{0} (rebuild)', inputs.package) }}

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'Deleting packages')"
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.lookup.outputs.repo_name }}
      variables: ${{ toJSON(steps.lookup.outputs) }}
    steps:
      - id: lookup
        name: Get info from monorepo
        run: |
          echo "package=curl" >> $GITHUB_OUTPUT
          echo "universe=jeroen" >> $GITHUB_OUTPUT
          echo "bar=" >> $GITHUB_OUTPUT
        shell: bash

  test:
    needs: prepare
    name: Test
    runs-on: ubuntu-latest
    steps:
      - id: lookup
        name: Get info from monorepo
        run: |
          echo "$variables"
        shell: bash
        env: ${{fromJSON(needs.prepare.outputs.variables)}}

  build:
    needs: prepare
    name: Build and deploy
    uses: r-universe-org/workflows/.github/workflows/build.yml@test
    env: ${{fromJSON(needs.prepare.outputs.variables)}}
    secrets:
      DUMMY_SESSION: ${{ secrets.DUMMY_SESSION }}
      CRANLIKEPWD: ${{ secrets.CRANLIKEPWD }}
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
      SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      BOT_TOKEN: ${{ secrets.GHPAT }}
